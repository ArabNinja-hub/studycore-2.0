<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Dashboard | StudyCore</title>
    <meta name="description" content="Your Copperbelt University first-year courses, progress and recent activity." />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body data-page="dashboard">
    <div id="siteNav"></div>
    <div id="mobileNavHost"></div>

    <main>
      <section class="section-tight" style="padding-top:36px;">
        <div class="container">

          <!-- ── 1. Welcome ─────────────────────────────────────────────
               Name + context. Nothing else: no streak flames, no badges,
               no stat tiles. A first-year should be able to read this in
               one second and move on to their courses.                 -->
          <div class="sc-welcome">
            <div class="sc-welcome-top">
              <span id="dashAvatarSlot"></span>
              <div style="min-width:0;">
                <h1 id="dashName">Welcome back</h1>
                <p id="dashSub"></p>
              </div>
              <div class="sc-welcome-actions" id="dashHeroActions"></div>
            </div>
          </div>

          <!-- Access status (trial / premium / expired) — functional, so it
               stays, but it is the only banner on the page. -->
          <div id="statusBannerSlot" style="margin-top:20px;"></div>

          <!-- ── 2. My Courses ──────────────────────────────────────────
               The heart of the dashboard. Only the student's own
               programme's first-year courses ever appear here.        -->
          <div style="margin-top:30px;">
            <div class="sc-section-head">
              <div>
                <h2 style="margin:0;">My Courses</h2>
                <p id="myCoursesSub" class="sc-small sc-muted" style="margin:4px 0 0;"></p>
              </div>
              <a class="sc-section-link" href="/pages/courses.html">All courses <span data-icon="arrow-right" data-icon-size="15"></span></a>
            </div>
            <div class="sc-course-grid" id="myCoursesList" aria-live="polite" aria-busy="true">
              <div class="sc-skeleton-row sc-skeleton-card" aria-hidden="true"></div>
              <div class="sc-skeleton-row sc-skeleton-card" aria-hidden="true"></div>
              <div class="sc-skeleton-row sc-skeleton-card" aria-hidden="true"></div>
            </div>
          </div>

          <!-- ── 3. Recent Activity + My Progress ─────────────────────── -->
          <div class="dash-grid" style="margin-top:34px;">
            <div class="card dash-section span-7">
              <div class="dash-section-head">
                <h3>Recent Activity</h3>
                <a href="/pages/resources.html">Resources</a>
              </div>
              <div class="sc-list" id="recentList">
                <div class="sc-skeleton-row" aria-hidden="true"></div>
                <div class="sc-skeleton-row" aria-hidden="true"></div>
              </div>
            </div>

            <div class="card dash-section span-5">
              <div class="dash-section-head"><h3>My Progress</h3></div>
              <div id="progressSummaryBox">
                <div class="sc-skeleton-row" aria-hidden="true"></div>
              </div>
            </div>
          </div>

          <!-- ── Premium ──────────────────────────────────────────────── -->
          <div id="premium" style="margin-top:36px;scroll-margin-top:100px;">
            <div class="premium-card" id="premiumPanel">
              <div class="skeleton skeleton-text w60" style="background:rgba(255,255,255,0.1);"></div>
              <div class="skeleton skeleton-text w80" style="background:rgba(255,255,255,0.1);"></div>
            </div>
          </div>

          <!-- ── Account: profile, password, programme, referral ──────── -->
          <div id="profile" style="margin-top:36px;scroll-margin-top:100px;">
            <div class="sc-section-head">
              <div><h2 style="margin:0;">Account</h2></div>
            </div>
            <div class="dash-grid">
              <div class="card dash-section span-6">
                <div class="dash-section-head"><h3>Profile</h3></div>
                <div style="display:flex;align-items:center;gap:18px;margin-bottom:20px;flex-wrap:wrap;">
                  <span id="profileAvatarSlot"></span>
                  <div style="display:flex;gap:10px;flex-wrap:wrap;">
                    <label class="btn btn-outline btn-sm" style="cursor:pointer;">
                      Change photo
                      <input type="file" id="avatarInput" accept="image/png,image/jpeg,image/webp" style="display:none;" />
                    </label>
                    <button class="btn btn-ghost btn-sm" id="avatarRemoveBtn" style="display:none;color:var(--red-600);">Remove photo</button>
                  </div>
                </div>
                <form id="profileForm" class="upload-form" style="gap:12px;">
                  <div class="form-group">
                    <label for="profileName">Full name</label>
                    <input id="profileName" type="text" required autocomplete="name" />
                  </div>
                  <button class="btn btn-primary" type="submit">Save changes</button>
                </form>

                <!-- Programme: chosen at signup, changeable here. This is the
                     one setting that decides which courses a student sees. -->
                <div id="programSelectCard" style="margin-top:22px;padding-top:18px;border-top:1px solid var(--border);">
                  <h3 style="font-size:1rem;margin-bottom:6px;">My Programme</h3>
                  <p class="sc-small sc-muted" style="margin-bottom:12px;">
                    Your programme decides which courses, notes, videos and past papers you see.
                  </p>
                  <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
                    <select id="programSelect" style="min-width:240px;"></select>
                    <button class="btn btn-outline btn-sm" id="programSaveBtn" type="button">Update programme</button>
                  </div>
                  <div id="myCoursesSummary" class="sc-small sc-muted" style="margin-top:12px;"></div>
                </div>
              </div>

              <div class="card dash-section span-6">
                <div class="dash-section-head"><h3>Password</h3></div>
                <form id="passwordForm" class="upload-form" style="gap:12px;">
                  <div class="form-group">
                    <label for="currentPassword">Current password</label>
                    <div class="password-field-wrap">
                      <input id="currentPassword" type="password" required autocomplete="current-password" />
                      <button type="button" class="password-toggle-btn" data-toggle-password="currentPassword" aria-label="Show password">
                        <svg class="pw-eye-open" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3.2"/></svg>
                        <svg class="pw-eye-closed" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" style="display:none;"><path d="M3 3l18 18M10.6 10.7a3.2 3.2 0 0 0 4.5 4.5M7.4 7.5C4.7 9 2.9 12 2.9 12s3.5 7 9.1 7c1.7 0 3.2-.5 4.4-1.2M12.2 5c6.4-.2 9.9 7 9.9 7a15 15 0 0 1-2.5 3.3"/></svg>
                      </button>
                    </div>
                  </div>
                  <div class="form-group">
                    <label for="newPassword">New password</label>
                    <div class="password-field-wrap">
                      <input id="newPassword" type="password" required minlength="6" autocomplete="new-password" />
                      <button type="button" class="password-toggle-btn" data-toggle-password="newPassword" aria-label="Show password">
                        <svg class="pw-eye-open" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3.2"/></svg>
                        <svg class="pw-eye-closed" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" style="display:none;"><path d="M3 3l18 18M10.6 10.7a3.2 3.2 0 0 0 4.5 4.5M7.4 7.5C4.7 9 2.9 12 2.9 12s3.5 7 9.1 7c1.7 0 3.2-.5 4.4-1.2M12.2 5c6.4-.2 9.9 7 9.9 7a15 15 0 0 1-2.5 3.3"/></svg>
                      </button>
                    </div>
                  </div>
                  <button class="btn btn-outline" type="submit">Update password</button>
                </form>
                <div style="margin-top:22px;padding-top:18px;border-top:1px solid var(--border);">
                  <h3 style="font-size:1rem;margin-bottom:8px;">Invite a friend</h3>
                  <div id="referralArea" class="sc-small"></div>
                </div>
              </div>
            </div>
          </div>

          <!-- ── Announcements + bookmarks (existing features, kept) ──── -->
          <div class="dash-grid" style="margin-top:36px;">
            <div class="card dash-section span-6">
              <div class="dash-section-head">
                <h3>Announcements</h3>
                <a href="/pages/announcements.html">View all</a>
              </div>
              <div id="announcementList" style="display:flex;flex-direction:column;gap:12px;"><div class="skeleton skeleton-row" style="height:64px;"></div></div>
            </div>
            <div class="card dash-section span-6">
              <div class="dash-section-head">
                <h3>Your Bookmarks</h3>
              </div>
              <div id="bookmarkList" style="display:flex;flex-direction:column;gap:12px;"><div class="skeleton skeleton-row" style="height:64px;"></div></div>
            </div>
          </div>

        </div>
      </section>
    </main>

    <div id="siteFooter"></div>

    <script src="/js/icons.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/programs.js"></script>
    <script src="/js/components.js"></script>
    <script src="/js/scroll-reveal.js"></script>
    <script src="/js/dashboard.js"></script>
  </body>
</html>
