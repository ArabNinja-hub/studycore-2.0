<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Dashboard | StudyCore</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body data-page="dashboard">
    <div id="topBarHost"></div>
    <div id="siteNav"></div>
    <div id="mobileNavHost"></div>

    <main>
      <section class="section-tight" style="padding-top:36px;">
        <div class="container">
          <!-- Welcome hero -->
          <div class="dash-hero">
            <div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap;min-width:0;">
              <span id="dashAvatarSlot"></span>
              <div style="min-width:0;">
                <h1 id="dashName">Welcome back</h1>
                <p id="dashSub" style="margin-top:2px;"></p>
              </div>
            </div>
            <div class="dash-hero-actions" id="dashHeroActions"></div>
          </div>

          <!-- Access status banner -->
          <div id="statusBannerSlot" style="margin-top:20px;"></div>

          <!-- Continue learning -->
          <div id="continueSlot" style="margin-top:20px;"></div>

          <div class="dash-grid" style="margin-top:20px;">
            <!-- My courses -->
            <div class="card dash-section span-7">
              <div class="dash-section-head">
                <h3>My Courses</h3>
                <a href="/pages/courses.html">View all</a>
              </div>
              <div id="myCoursesList"><div class="skeleton skeleton-row"></div><div class="skeleton skeleton-row"></div><div class="skeleton skeleton-row"></div></div>
            </div>

            <!-- Streak + quick stats -->
            <div class="span-5" style="display:flex;flex-direction:column;gap:20px;">
              <div class="card dash-stat" id="streakCard">
                <span class="card-icon" id="streakIcon" style="width:50px;height:50px;"></span>
                <div>
                  <div class="stat-value" id="streakValue">—</div>
                  <div class="stat-label">Day study streak</div>
                </div>
              </div>
              <div class="card dash-stat" id="lessonsCard">
                <span class="card-icon" id="lessonsIcon" style="width:50px;height:50px;"></span>
                <div>
                  <div class="stat-value" id="lessonsValue">—</div>
                  <div class="stat-label">Lessons completed</div>
                </div>
              </div>
            </div>

            <!-- Achievements -->
            <div class="card dash-section span-12">
              <div class="dash-section-head">
                <h3>Achievements</h3>
              </div>
              <div class="achievement-grid" id="achievementsGrid"></div>
            </div>

            <!-- Recent activity + recommended -->
            <div class="card dash-section span-6">
              <div class="dash-section-head"><h3>Recent Activity</h3></div>
              <div id="activityList"><div class="skeleton skeleton-row" style="height:56px;"></div><div class="skeleton skeleton-row" style="height:56px;"></div></div>
            </div>
            <div class="card dash-section span-6">
              <div class="dash-section-head"><h3>Recommended For You</h3></div>
              <div id="recommendedList"><div class="skeleton skeleton-row" style="height:56px;"></div></div>
            </div>
          </div>

          <!-- Premium section -->
          <div id="premium" style="margin-top:36px;scroll-margin-top:100px;">
            <div class="premium-card" id="premiumPanel">
              <div class="skeleton skeleton-text w60" style="background:rgba(255,255,255,0.1);"></div>
              <div class="skeleton skeleton-text w80" style="background:rgba(255,255,255,0.1);"></div>
            </div>
          </div>

          <!-- Profile -->
          <div id="profile" style="margin-top:36px;scroll-margin-top:100px;">
            <div class="dash-grid">
              <div class="card dash-section span-6">
                <div class="dash-section-head"><h3>Profile</h3></div>
                <div style="display:flex;align-items:center;gap:18px;margin-bottom:20px;flex-wrap:wrap;">
                  <span id="profileAvatarSlot"></span>
                  <div style="display:flex;gap:10px;flex-wrap:wrap;">
                    <label class="btn btn-outline btn-sm" style="cursor:pointer;">
                      Change photo
                      <input type="file" id="avatarInput" accept="image/png,image/jpeg,image/webp" style="display:none;" />
                    </label>
                    <button class="btn btn-ghost btn-sm" id="avatarRemoveBtn" style="display:none;color:var(--red-600);">Remove photo</button>
                  </div>
                </div>
                <form id="profileForm" class="upload-form" style="gap:12px;">
                  <div class="form-row">
                    <div class="form-group">
                      <label for="profileName">Full name</label>
                      <input id="profileName" type="text" required />
                    </div>
                    <div class="form-group">
                      <label for="profileSchool">School</label>
                      <input id="profileSchool" type="text" placeholder="e.g. UNZA" />
                    </div>
                  </div>
                  <div class="form-row">
                    <div class="form-group">
                      <label for="profileGrade">Grade / Year</label>
                      <input id="profileGrade" type="text" placeholder="e.g. Year 2" />
                    </div>
                    <div class="form-group">
                      <label for="profileLevel">Learning level</label>
                      <select id="profileLevel">
                        <option value="secondary">Secondary school</option>
                        <option value="tertiary">University / Tertiary</option>
                      </select>
                    </div>
                  </div>
                  <button class="btn btn-primary" type="submit">Save changes</button>
                </form>
              </div>

              <div class="card dash-section span-6">
                <div class="dash-section-head"><h3>Password</h3></div>
                <form id="passwordForm" class="upload-form" style="gap:12px;">
                  <div class="form-group">
                    <label for="currentPassword">Current password</label>
                    <div class="password-field-wrap">
                      <input id="currentPassword" type="password" required autocomplete="current-password" />
                      <button type="button" class="password-toggle-btn" data-toggle-password="currentPassword" aria-label="Show password">
                        <svg class="pw-eye-open" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3.2"/></svg>
                        <svg class="pw-eye-closed" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" style="display:none;"><path d="M3 3l18 18M10.6 10.7a3.2 3.2 0 0 0 4.5 4.5M7.4 7.5C4.7 9 2.9 12 2.9 12s3.5 7 9.1 7c1.7 0 3.2-.5 4.4-1.2M12.2 5c6.4-.2 9.9 7 9.9 7a15 15 0 0 1-2.5 3.3"/></svg>
                      </button>
                    </div>
                  </div>
                  <div class="form-group">
                    <label for="newPassword">New password</label>
                    <div class="password-field-wrap">
                      <input id="newPassword" type="password" required minlength="6" autocomplete="new-password" />
                      <button type="button" class="password-toggle-btn" data-toggle-password="newPassword" aria-label="Show password">
                        <svg class="pw-eye-open" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3.2"/></svg>
                        <svg class="pw-eye-closed" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" style="display:none;"><path d="M3 3l18 18M10.6 10.7a3.2 3.2 0 0 0 4.5 4.5M7.4 7.5C4.7 9 2.9 12 2.9 12s3.5 7 9.1 7c1.7 0 3.2-.5 4.4-1.2M12.2 5c6.4-.2 9.9 7 9.9 7a15 15 0 0 1-2.5 3.3"/></svg>
                      </button>
                    </div>
                  </div>
                  <button class="btn btn-outline" type="submit">Update password</button>
                </form>
                <div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--border);">
                  <h3 style="font-size:1rem;margin-bottom:8px;">Invite a friend</h3>
                  <div id="referralArea" style="font-size:0.88rem;"></div>
                </div>
              </div>
            </div>
          </div>

          <!-- Community -->
          <div id="community" style="margin-top:36px;scroll-margin-top:100px;">
            <div class="community-panel" id="communityPanel"></div>
          </div>

          <!-- Announcements + bookmarks -->
          <div class="dash-grid" style="margin-top:36px;">
            <div class="card dash-section span-6">
              <div class="dash-section-head">
                <h3>Announcements</h3>
                <a href="/pages/announcements.html">View all</a>
              </div>
              <div id="announcementList" style="display:flex;flex-direction:column;gap:12px;"><div class="skeleton skeleton-row" style="height:64px;"></div></div>
            </div>
            <div class="card dash-section span-6">
              <div class="dash-section-head">
                <h3>Your Bookmarks</h3>
              </div>
              <div id="bookmarkList" style="display:flex;flex-direction:column;gap:12px;"><div class="skeleton skeleton-row" style="height:64px;"></div></div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <div id="siteFooter"></div>

    <script src="/js/icons.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/dashboard.js"></script>
  </body>
</html>
