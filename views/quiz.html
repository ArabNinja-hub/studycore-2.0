<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Quizzes | StudyCore</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Google Fonts are pulled in by style.css @import; warming the
         connections here removes a full DNS+TLS round trip on mobile. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/quiz.css" />
  </head>
  <body data-page="quiz">
    <div id="siteNav"></div>
    <div id="mobileNavHost"></div>

    <main>
      <section class="page-hero" style="padding:40px 0 28px;">
        <div class="container">
          <span class="eyebrow">Practice</span>
          <h1>Quizzes</h1>
          <p>Test yourself with program-targeted quizzes posted by your Content Admins and the StudyCore team. Every attempt is graded and saved so you can track your progress.</p>
        </div>
      </section>

      <section class="section-tight">
        <div class="container">
          <div id="quizView">
            <div id="quizList" class="quiz-grid"><p class="loading-text">Loading your quizzes…</p></div>
          </div>
        </div>
      </section>
    </main>

    <div id="siteFooter"></div>

    <script src="/js/icons.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/programs.js"></script>
    <script src="/js/scroll-reveal.js"></script>
    <script src="/js/quiz.js"></script>
  </body>
</html>
