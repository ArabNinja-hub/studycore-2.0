<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log In | StudyCore</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div class="page-shell">
      <nav class="navbar">
        <div class="container nav-inner">
          <a href="index.html" class="nav-brand"><span>Study</span><span>Core</span></a>
        </div>
      </nav>
      <main class="page-main">
        <section class="section">
          <div class="container" style="max-width: 480px; margin: 60px auto;">
            <div class="info-card">
              <h2>Welcome back</h2>
              <p>Log in to continue to your dashboard.</p>
              <form id="loginForm" class="upload-form" novalidate>
                <div class="form-group">
                  <label for="email">Email</label>
                  <input id="email" type="email" required autocomplete="email" />
                </div>
                <div class="form-group">
                  <label for="password">Password</label>
                  <div class="password-field-wrap">
                    <input id="password" type="password" required autocomplete="current-password" minlength="6" />
                    <button type="button" class="password-toggle-btn" data-toggle-password="password" aria-label="Show password">
                      <svg class="pw-eye-open" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3.2"/></svg>
                      <svg class="pw-eye-closed" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" style="display:none;"><path d="M3 3l18 18M10.6 10.7a3.2 3.2 0 0 0 4.5 4.5M7.4 7.5C4.7 9 2.9 12 2.9 12s3.5 7 9.1 7c1.7 0 3.2-.5 4.4-1.2M12.2 5c6.4-.2 9.9 7 9.9 7a15 15 0 0 1-2.5 3.3"/></svg>
                    </button>
                  </div>
                </div>
                <div id="loginError" style="color:#D64545;display:none;font-size:0.9rem;"></div>
                <button class="btn btn-primary" type="submit" id="loginSubmitBtn">Log In</button>
              </form>
              <p style="margin-top: 12px;">Don't have an account? <a href="signup.html">Create one</a></p>
            </div>
          </div>
        </section>
      </main>
    </div>
    <script src="js/api.js"></script>
    <script>
      document.querySelectorAll('[data-toggle-password]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const input = document.getElementById(btn.getAttribute('data-toggle-password'));
          const showing = input.type === 'text';
          input.type = showing ? 'password' : 'text';
          btn.querySelector('.pw-eye-open').style.display = showing ? '' : 'none';
          btn.querySelector('.pw-eye-closed').style.display = showing ? 'none' : '';
          btn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
        });
      });

      const form = document.getElementById('loginForm');
      const errorBox = document.getElementById('loginError');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorBox.style.display = 'none';
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        if (!email || !password) return;
        const btn = document.getElementById('loginSubmitBtn');
        btn.disabled = true;
        btn.textContent = 'Logging in...';
        try {
          const data = await StudyCoreAPI.login({ email, password });
          try { sessionStorage.setItem('sc_show_welcome', JSON.stringify({ name: data.user.name || '', type: 'login' })); } catch { /* not fatal - transition just won't show */ }
          window.location.href = data.user.role === 'ADMIN' ? '/admin.html' : '/dashboard.html';
        } catch (err) {
          errorBox.textContent = err.message;
          errorBox.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Log In';
        }
      });
    </script>
  </body>
</html>
