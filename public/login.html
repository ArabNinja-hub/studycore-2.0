<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Log In | StudyCore</title>
    <meta name="description" content="Log in to StudyCore to continue your learning — courses, lessons, progress and Premium." />
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Google Fonts are pulled in by style.css @import; warming the
         connections here removes a full DNS+TLS round trip on mobile. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body data-page="auth">
    <div id="siteNav"></div>
    <div id="mobileNavHost"></div>

    <main>
      <div class="auth-wrap">
        <div class="card auth-card">
          <h1>Welcome back</h1>
          <p class="auth-sub">Log in to continue exactly where you left off.</p>
          <div class="auth-trial-note" id="referralBanner" style="display:none;"></div>
          <form id="loginForm" novalidate>
            <div class="form-group">
              <label for="email">Email</label>
              <input id="email" name="email" type="email" required autocomplete="email" />
            </div>
            <div class="form-group">
              <label for="password">Password</label>
              <div class="password-field-wrap">
                <input id="password" name="password" type="password" required autocomplete="current-password" minlength="6" />
                <button type="button" class="password-toggle-btn" data-toggle-password="password" aria-label="Show password">
                  <svg class="pw-eye-open" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3.2"/></svg>
                  <svg class="pw-eye-closed" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" style="display:none;"><path d="M3 3l18 18M10.6 10.7a3.2 3.2 0 0 0 4.5 4.5M7.4 7.5C4.7 9 2.9 12 2.9 12s3.5 7 9.1 7c1.7 0 3.2-.5 4.4-1.2M12.2 5c6.4-.2 9.9 7 9.9 7a15 15 0 0 1-2.5 3.3"/></svg>
                </button>
              </div>
            </div>
            <div id="loginError" style="color:var(--red-600);display:none;font-size:0.88rem;margin-bottom:12px;"></div>
            <button class="btn btn-primary btn-block btn-lg" type="submit" id="loginSubmitBtn">Log In</button>
          </form>
          <p style="margin-top:16px;text-align:center;font-size:0.92rem;">
            New to StudyCore? <a href="/signup.html">Create a free account</a>
          </p>
          <p style="margin-top:10px;text-align:center;font-size:0.86rem;color:var(--muted);">
            Need a publishing account? <a href="/content-admin-signup.html">Create Admin Account</a>
          </p>
          <p class="auth-legal">By logging in you agree to the <a href="/pages/terms.html">Terms &amp; Conditions</a> and <a href="/pages/privacy.html">Privacy Policy</a>.</p>
        </div>
      </div>
    </main>

    <script src="/js/icons.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/programs.js"></script>
    <script src="/js/scroll-reveal.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        // Referral invite landing
        const refCode = new URLSearchParams(window.location.search).get('ref');
        if (refCode) {
          const banner = document.getElementById('referralBanner');
          banner.style.display = 'flex';
          banner.innerHTML = `${SC.icon('sparkles', { size: 18 })}<span>You were invited by a friend — sign up with their code so they get their 7 bonus days.</span>`;
        }

        document.querySelectorAll('[data-toggle-password]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const input = document.getElementById(btn.getAttribute('data-toggle-password'));
            const showing = input.type === 'text';
            input.type = showing ? 'password' : 'text';
            btn.querySelector('.pw-eye-open').style.display = showing ? '' : 'none';
            btn.querySelector('.pw-eye-closed').style.display = showing ? 'none' : '';
            btn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
          });
        });

        const form = document.getElementById('loginForm');
        const errorBox = document.getElementById('loginError');
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          errorBox.style.display = 'none';
          const email = document.getElementById('email').value.trim();
          const password = document.getElementById('password').value;
          if (!email || !password) {
            errorBox.textContent = 'Please enter your email and password.';
            errorBox.style.display = 'block';
            return;
          }
          const btn = document.getElementById('loginSubmitBtn');
          btn.disabled = true;
          btn.textContent = 'Logging in…';
          try {
            const data = await StudyCoreAPI.login({ email, password });
            StudyCoreAuth.setWelcomeFlag(data.user.name, 'login');
            window.location.href = StudyCoreAuth.getDashboardPage(data.user);
          } catch (err) {
            errorBox.textContent = err.message;
            errorBox.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Log In';
          }
        });
      });
    </script>
  </body>
</html>
