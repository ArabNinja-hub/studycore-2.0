<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search | StudyCore</title>
    <meta name="description" content="Search courses, topics, lessons, notes and past papers across StudyCore." />
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body data-page="search">
    <div id="topBarHost"></div>
    <div id="siteNav"></div>
    <div id="mobileNavHost"></div>

    <main>
      <section class="page-hero">
        <div class="container">
          <span class="eyebrow">Search</span>
          <h1>Find anything on StudyCore</h1>
          <p>Courses, topics, lessons, notes and past papers — one search, in order of relevance.</p>
        </div>
      </section>

      <section class="section">
        <div class="container" style="max-width:760px;">
          <div class="card" style="padding:6px 6px 6px 18px;display:flex;align-items:center;gap:12px;margin-bottom:28px;box-shadow:var(--shadow);">
            <span class="search-page-icon" style="color:var(--muted);display:inline-flex;"></span>
            <input type="search" id="searchInput" placeholder="Search e.g. 'circular motion' or 'past papers'…" style="flex:1;border:none;outline:none;font-size:1.05rem;padding:16px 0;background:transparent;" autocomplete="off" />
          </div>

          <div id="searchState">
            <div class="empty-state" style="border:none;background:transparent;">
              <div class="empty-icon" id="searchEmptyIcon"></div>
              <h3>Start typing to search</h3>
              <p>Results respect your access level — protected Premium content shows as locked.</p>
            </div>
          </div>
        </div>
      </section>
    </main>

    <div id="siteFooter"></div>

    <script src="/js/icons.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/main.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', async () => {
        const user = await StudyCoreAuth.fetchSession();
        const input = document.getElementById('searchInput');
        const state = document.getElementById('searchState');
        const iconSlot = document.querySelector('.search-page-icon');
        if (iconSlot) iconSlot.innerHTML = SC.icon('search', { size: 20 });
        const emptyIcon = document.getElementById('searchEmptyIcon');
        if (emptyIcon) emptyIcon.innerHTML = SC.icon('search', { size: 26 });

        const params = new URLSearchParams(location.search);
        if (params.get('q')) input.value = params.get('q');

        let timer = null;
        input.addEventListener('input', () => {
          clearTimeout(timer);
          timer = setTimeout(() => run(input.value), 300);
        });

        async function run(q) {
          q = q.trim();
          history.replaceState(null, '', q ? `?q=${encodeURIComponent(q)}` : location.pathname);
          if (!q) {
            state.innerHTML = emptyState({ icon: 'search', title: 'Start typing to search', body: 'Courses, topics, lessons, notes and past papers.' });
            return;
          }
          state.innerHTML = `<div style="display:flex;flex-direction:column;gap:12px;"><div class="skeleton skeleton-row"></div><div class="skeleton skeleton-row"></div><div class="skeleton skeleton-row"></div></div>`;
          try {
            const data = await fetch(`/api/resources/search?q=${encodeURIComponent(q)}&limit=10`, { credentials: 'include' }).then((r) => r.json());
            render(data);
          } catch {
            state.innerHTML = emptyState({ icon: 'alert-triangle', title: 'Search unavailable', body: 'Please try again in a moment.' });
          }
        }

        function render(data) {
          const parts = [];
          const CAT = { video: ['Video lesson', 'video'], document: ['Notes', 'file-text'], tutorial: ['Tutorial', 'file-text'], past_paper: ['Past paper', 'file'] };
          if (data.courses.length) {
            parts.push(`<h3 style="font-size:0.8rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--faint);margin:10px 0 8px;">Courses</h3>` +
              data.courses.map((c) => `<a class="card card-hover" style="display:flex;align-items:center;gap:14px;padding:14px 16px;text-decoration:none;color:var(--ink);margin-bottom:8px;" href="/pages/subjects/${c.slug}.html"><span class="card-icon">${SC.icon(SC.courseIcon(c.slug), { size: 20 })}</span><span style="font-weight:600;">${escapeHtml(c.subject)}</span></a>`).join(''));
          }
          if (data.topics.length) {
            parts.push(`<h3 style="font-size:0.8rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--faint);margin:14px 0 8px;">Topics</h3>` +
              data.topics.map((t) => `<a class="card card-hover" style="display:flex;align-items:center;gap:14px;padding:12px 16px;text-decoration:none;color:var(--ink);margin-bottom:8px;" href="/pages/subjects/${t.slug}.html"><span class="card-icon">${SC.icon('layers', { size: 19 })}</span><span style="flex:1;"><strong style="color:var(--ink);font-size:0.95rem;">${escapeHtml(t.topic)}</strong><div style="font-size:0.8rem;color:var(--muted);">${escapeHtml(t.subject)}</div></span><span>${SC.icon('chevron-right', { size: 17 })}</span></a>`).join(''));
          }
          if (data.results.length) {
            parts.push(`<h3 style="font-size:0.8rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--faint);margin:14px 0 8px;">Lessons &amp; resources</h3>` +
              data.results.map((r) => {
                const [label, ic] = CAT[r.category] || ['Resource', 'file-text'];
                const where = [r.subject, r.topic].filter(Boolean).join(' · ');
                return `<a class="card card-hover" style="display:flex;align-items:center;gap:14px;padding:14px 16px;text-decoration:none;color:var(--ink);margin-bottom:8px;${r.locked ? 'opacity:0.85;' : ''}" href="/pages/lesson.html?id=${r.id}&subject=${encodeURIComponent(r.subject || '')}">
                  <span class="card-icon" style="${r.locked ? 'background:var(--amber-100);color:var(--amber-600);' : ''}">${SC.icon(r.locked ? 'lock' : ic, { size: 19 })}</span>
                  <span style="flex:1;min-width:0;"><strong style="color:var(--ink);font-size:0.95rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(r.title)}</strong><div style="font-size:0.8rem;color:var(--muted);">${escapeHtml(where)}</div></span>
                  <span class="badge ${r.locked ? 'badge-amber' : 'badge-neutral'}">${r.locked ? 'Premium' : label}</span>
                </a>`;
              }).join(''));
          }
          if (parts.length === 0) {
            state.innerHTML = emptyState({ icon: 'search', title: `No results for "${data.query}"`, body: 'Try a course or topic name, e.g. "Physics" or "circular motion".' });
            return;
          }
          if (!data.authenticated) {
            parts.push(`<div class="status-banner trial" style="margin-top:16px;"><span class="status-icon">${SC.icon('user', { size: 19 })}</span><div style="flex:1;"><strong>Log in for full results</strong><span>Lessons and resources are searched for logged-in students.</span></div><a class="btn btn-primary btn-sm" href="/login.html">Log In</a></div>`);
          }
          state.innerHTML = parts.join('');
        }

        if (input.value) run(input.value);
      });
    </script>
  </body>
</html>
