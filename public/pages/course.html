<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Course Home | StudyCore</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/course.css" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div class="page-shell">
      <nav class="navbar">
        <div class="container nav-inner">
          <a href="../index.html" class="nav-brand">
            <img src="../assets/logo.jpg" alt="StudyCore Logo" />
            <span class="nav-brand-text"><span>Study</span><span>Core</span></span>
          </a>
          <ul class="nav-links">
            <li><a href="courses.html">Courses</a></li>
            <li><a href="documents.html">Documents</a></li>
            <li><a href="videos.html">Videos</a></li>
            <li><a href="quizzes.html">Quizzes</a></li>
            <li><a href="assignments.html">Assignments</a></li>
            <li><a href="announcements.html">Announcements</a></li>
            <li><a href="search.html">Search</a></li>
          </ul>
          <div class="nav-actions"></div>
        </div>
      </nav>

      <main class="page-main">
        <section class="course-hero">
          <div class="container">
            <div class="course-hero-top">
              <div>
                <p class="course-eyebrow" id="courseEyebrow">Course</p>
                <h1 id="courseTitle">Loading course...</h1>
              </div>
              <div class="course-streak" id="courseStreak" style="display:none;">
                <span class="course-streak-flame">🔥</span>
                <span id="courseStreakText"></span>
              </div>
            </div>

            <div class="course-progress-block">
              <div class="course-progress-row">
                <span id="courseProgressLabel">0% Complete</span>
                <span id="courseProgressCount" class="resource-meta"></span>
              </div>
              <div class="course-progress-track">
                <div class="course-progress-fill" id="courseProgressFill" style="width:0%;"></div>
              </div>
            </div>

            <div id="continueLearningCard" class="continue-card" style="display:none;">
              <div>
                <p class="continue-eyebrow">Continue where you left off</p>
                <h3 id="continueTitle"></h3>
              </div>
              <a class="btn btn-primary" id="continueBtn" href="#">Continue →</a>
            </div>
          </div>
        </section>

        <section class="section">
          <div class="container">
            <div class="course-search-row">
              <input type="search" id="courseSearch" placeholder="Search within this course - e.g. 'Newton'" />
            </div>

            <div class="course-tabs" id="courseTabs" role="tablist"></div>

            <div id="courseTabPanels"></div>
          </div>
        </section>
      </main>
    </div>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/course.js"></script>
  </body>
</html>
