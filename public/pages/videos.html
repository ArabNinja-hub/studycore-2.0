<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Lessons | StudyCore</title>
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body data-page="videos">
    <div id="siteNav"></div>
    <div id="mobileNavHost"></div>

    <main>
      <section class="page-hero" style="padding:40px 0 28px;">
        <div class="container">
          <nav class="breadcrumb" aria-label="Breadcrumb">
            <a href="/">StudyCore</a>
            <span class="sep" aria-hidden="true"></span>
            <a href="/pages/courses.html">Courses</a>
            <span class="sep" aria-hidden="true"></span>
            <a id="courseCrumb" href="/pages/courses.html">Course</a>
            <span class="sep" aria-hidden="true"></span>
            <span class="current" id="termCrumb">Videos</span>
          </nav>
          <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
            <span class="card-icon" style="width:52px;height:52px;">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 8-6 4 6 4V8Z"/><rect width="14" height="12" x="2" y="6" rx="2"/></svg>
            </span>
            <div style="min-width:0;">
              <h1 id="videosTitle" style="font-size:clamp(1.5rem,3.4vw,2.2rem);">Video Lessons</h1>
              <p id="videosSub" style="margin-top:4px;">Video lessons for this course and term.</p>
            </div>
          </div>
        </div>
      </section>

      <div class="course-subnav" id="termSubnav">
        <div class="container nav-inner">
          <a class="course-subnav-back" id="courseHomeLink" href="/pages/courses.html">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
            <span>Back to course</span>
          </a>
          <ul class="subnav-links" id="termSubnavLinks"></ul>
        </div>
      </div>

      <section class="section-tight" id="continueSection" style="display:none;padding-top:26px;">
        <div class="container">
          <div class="continue-card" id="continueCard"></div>
        </div>
      </section>

      <section class="section" id="termVideos" style="scroll-margin-top:calc(var(--nav-h) + var(--nav-float) + 80px);">
        <div class="container">
          <div class="lesson-list" id="videoList" style="max-width:860px;">
            <div class="skeleton skeleton-row"></div>
            <div class="skeleton skeleton-row"></div>
            <div class="skeleton skeleton-row"></div>
          </div>
        </div>
      </section>
    </main>

    <div id="siteFooter"></div>

    <script src="/js/icons.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/scroll-reveal.js"></script>
    <script src="/js/video.js"></script>
  </body>
</html>
